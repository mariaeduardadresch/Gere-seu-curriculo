<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criador de Currículo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Tela Inicial ===== -->
  <div id="homeScreen" class="screen active">
    <div class="auth-container">
      <div class="auth-logo">
        <img src="logo.png" alt="Logo da Empresa" class="logo-small" />
      </div>
      <h1>Crie seu Currículo</h1>
      <p>Crie o seu currículo e baixe em PDF gratuitamente.</p>
      <button class="btn" onclick="iniciarCurriculo()">Crie seu Currículo</button>
    </div>
  </div>

  <!-- ===== Tela de Criação do Currículo ===== -->
  <div id="curriculoScreen" class="screen">
    <div class="curriculo-container">

    
      <!-- Pré-visualização -->
      <div class="preview">
        <h2>Pré-visualização do Currículo</h2>
        <div id="previewBox">
          <div id="previewContent">
            <img id="previewFoto" src="" alt="Foto"
              style="display:none; width:120px; height:120px; border-radius:50%; object-fit:cover;" />
            <p><strong>Nome:</strong> <span id="prevNome"></span></p>
            <p><strong>Email:</strong> <span id="prevEmail"></span></p>
            <p><strong>Telefone:</strong> <span id="prevTelefone"></span></p>
            <p><strong>Objetivo Profissional:</strong> <span id="prevObjetivo"></span></p>
            <p><strong>Formação Acadêmica:</strong> <span id="prevFormacao"></span></p>
            <p><strong>Experiência Profissional:</strong> <span id="prevExperiencia"></span></p>
            <p><strong>Hard Skills:</strong> <span id="prevHabilidades"></span></p>
            <p><strong>Soft Skills:</strong> <span id="prevHabilidadesComp"></span></p>
            <p><strong>Cursos:</strong> <span id="prevCursos"></span></p>
            <p><strong>LinkedIn:</strong> <a id="prevLinkedin" href="#" target="_blank"></a></p>
          </div>
        </div>
        <button class="btn red" onclick="gerarPDF()">Gerar PDF</button>
        <button class="btn" onclick="logout()">Voltar</button>
      </div>

      <!-- Formulário -->
      <div class="formulario">
        <h2>Edite suas informações</h2>

        <label>Foto:</label>
        <input type="file" id="foto" accept="image/*" onchange="previewFoto(event)" />

        <label>Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo" oninput="updatePreview()" />

        <label>Email:</label>
        <input type="email" id="email" placeholder="seuemail@email.com" oninput="updatePreview()" />

        <label>Telefone:</label>
        <input type="tel" id="telefone" placeholder="(xx) xxxxx-xxxx" oninput="updatePreview()" />
        
        <label>Objetivo Profissional:</label>
        <textarea id="objetivo" placeholder="Descreva seu objetivo profissional..." oninput="updatePreview()"></textarea>


        <label>Formação Acadêmica:</label>
        <div class="multi-input">
  <input type="text" id="formacaoInput" placeholder="Inclua o nome do curso técnico/graduação, a instituição e o ano de conclusão...">
  <button type="button" onclick="habilitarCampo('formacao')">+</button>
  <ul id="formacaoList"></ul>
</div>

      

       <label>Experiência Profissional:</label>
<div class="multi-input">
  <input type="text" id="experienciaInput" placeholder="Digite suas experiências anteriores">
  <button type="button" onclick="habilitarCampo('experiencia')">+</button>
<ul id="experienciaList"></ul>
</div>

<label>Hard Skills:</label>
<div class="multi-input">
  <input type="text" id="habilidadesInput" placeholder="Ex.:Pacote Office, Canva, Excel, Edição de Vídeo, etc."">
  <button type="button" onclick="habilitarCampo('habilidades')">+</button>
  <ul id="habilidadesList"></ul>
</div>

<label>Soft Skills:</label>
<div class="multi-input">
  <input type="text" id="habilidadesCompInput" placeholder="Ex.:Trabalho em equipe, Comunicação, Liderança,Pensamento crítico,etc.">
  <button type="button" onclick="habilitarCampo('habilidadesComp')">+</button>
 <ul id="habilidadesCompList"></ul>
</div>

     
        <label>Cursos:</label>
<div class="multi-input">
  <input type="text" id="cursosInput" placeholder="Inclua o nome do curso, a instituição e o ano de conclusão..."">
 <button type="button" onclick="habilitarCampo('cursos')">+</button>
  <ul id="cursosList"></ul>
</div>

        

        <label>LinkedIn:</label>
        <input type="url" id="linkedin" placeholder="https://linkedin.com/in/seu-perfil" oninput="updatePreview()" />
      </div>

    </div>
  </div>

  <!-- ===== jsPDF + Script ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
